<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/game-logo.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClassGame</title>
  <script type="module" crossorigin src="/assets/index-CKZAKFo-.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CuiA7Wwa.css">
</head>

<body>
  <div id="app">
    <!-- SCREEN: LANDING -->
    <div id="screen-landing" class="screen">
      <div class="landing-container">
        <img src="/game-logo.jpg" alt="ClassGame Logo" class="game-logo-img">

        <div class="login-panel">
          <div class="avatar-preview-container">
            <div id="avatar-preview" class="avatar-emoji">😀</div>
            <button id="btn-random-avatar" class="btn-icon" title="Randomize Avatar">🎲</button>
          </div>

          <div class="emoji-picker">
            <button class="emoji-option" data-emoji="😀">😀</button>
            <button class="emoji-option" data-emoji="😎">😎</button>
            <button class="emoji-option" data-emoji="🤓">🤓</button>
            <button class="emoji-option" data-emoji="😊">😊</button>
            <button class="emoji-option" data-emoji="🥳">🥳</button>
            <button class="emoji-option" data-emoji="🤩">🤩</button>
            <button class="emoji-option" data-emoji="😇">😇</button>
            <button class="emoji-option" data-emoji="🤠">🤠</button>
            <button class="emoji-option" data-emoji="🥸">🥸</button>
            <button class="emoji-option" data-emoji="🤡">🤡</button>
            <button class="emoji-option" data-emoji="👻">👻</button>
            <button class="emoji-option" data-emoji="👽">👽</button>
            <button class="emoji-option" data-emoji="🤖">🤖</button>
            <button class="emoji-option" data-emoji="🐶">🐶</button>
            <button class="emoji-option" data-emoji="🐱">🐱</button>
            <button class="emoji-option" data-emoji="🐼">🐼</button>
          </div>

          <input type="text" id="input-name" placeholder="Enter your name" maxlength="12">

          <button id="btn-make-game" class="btn-blue-dark btn-large" style="margin-bottom: 10px;">Make a Game</button>
          <button id="btn-join-game" class="btn-green btn-large">Join Game</button>
        </div>
      </div>
    </div>

    <!-- SCREEN: JOIN GAME -->
    <div id="screen-join" class="screen hidden">
      <div class="landing-container" style="width: 500px;">
        <h2>Join a Game</h2>

        <div class="join-method">
          <h3>Manual Connection</h3>
          <p class="hint-text">Enter the Host IP (last digits)</p>
          <div class="ip-input-group">
            <span id="ip-prefix">192.168.1.</span>
            <input type="number" id="input-ip-suffix" placeholder="XXX" min="0" max="255">
            <button id="btn-connect-ip" class="btn-green">Connect</button>
          </div>
        </div>

        <div class="join-method">
          <h3>Found Games</h3>
          <div id="server-list" class="server-list">
            <div class="server-list-placeholder">Searching for games...</div>
          </div>
        </div>

        <button id="btn-back-landing" class="btn-orange" style="margin-top: 20px;">Back</button>
      </div>
    </div>

    <!-- SCREEN: LOBBY -->
    <div id="screen-lobby" class="screen hidden">
      <div class="lobby-container">
        <!-- Header -->
        <div class="lobby-header">
          <div class="server-info">
            <span>Server: </span><span id="server-ip">Loading...</span>
          </div>
          <div class="invite-link">
            <span>Invite: </span><span id="lobby-invite-link">http://...</span>
            <button id="btn-copy-invite" class="btn-small">Copy</button>
          </div>
        </div>

        <!-- Main Content -->
        <div class="lobby-content">
          <!-- Left: Players -->
          <div class="panel lobby-players">
            <div class="panel-header">Players (<span id="lobby-player-count">0</span>)</div>
            <div id="lobby-player-list" class="player-list">
              <!-- Player items go here -->
            </div>
          </div>

          <!-- Center: Settings -->
          <div class="panel lobby-settings">
            <div class="panel-header">Settings</div>
            <div class="settings-form">
              <div class="form-group">
                <label>Rounds</label>
                <select id="setting-rounds" disabled>
                  <option value="2">2</option>
                  <option value="3" selected>3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                </select>
              </div>
              <div class="form-group">
                <label>Draw Time (s)</label>
                <select id="setting-draw-time" disabled>
                  <option value="60">60</option>
                  <option value="80" selected>80</option>
                  <option value="100">100</option>
                  <option value="120">120</option>
                </select>
              </div>
              <div class="form-group">
                <label>Word Count</label>
                <select id="setting-word-count" disabled>
                  <option value="3" selected>3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                </select>
              </div>
              <div class="form-group">
                <label>Hints</label>
                <select id="setting-hints" disabled>
                  <option value="2" selected>2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                </select>
              </div>
              <div class="form-group">
                <label>Difficulty / Δυσκολία</label>
                <select id="setting-difficulty" disabled>
                  <option value="easy" selected>😊 Easy (πεζά=κεφαλαία)</option>
                  <option value="hard">🔥 Hard (ακριβώς + τόνοι)</option>
                </select>
              </div>
              <div class="form-group">
                <label>Language / Γλώσσα</label>
                <select id="setting-language" disabled>
                  <option value="en" selected>🇬🇧 English</option>
                  <option value="gr">🇬🇷 Ελληνικά</option>
                </select>
              </div>
              <div class="form-group">
                <label>Custom Words (comma-separated)</label>
                <textarea id="setting-custom-words" rows="3" placeholder="dog, cat, tree..." disabled></textarea>
              </div>
              <div class="form-group">
                <label>
                  <input type="checkbox" id="setting-my-words-only" disabled>
                  My Words Only
                </label>
              </div>

              <button id="btn-start-game" class="btn-green btn-large hidden">Start Game</button>
            </div>
          </div>

          <!-- Right: Chat -->
          <div class="panel lobby-chat">
            <div class="panel-header">Chat</div>
            <div id="lobby-chat-messages" class="chat-messages"></div>
            <div class="chat-input-area">
              <input type="text" id="lobby-chat-input" placeholder="Type here...">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- SCREEN: GAME -->
    <div id="screen-game" class="screen hidden">
      <!-- Game Header -->
      <div class="game-header">
        <div class="timer-container">
          <div id="timer">0</div>
        </div>
        <div class="round-info">Round <span id="current-round">1</span> of <span id="total-rounds">3</span></div>
        <div class="word-container">
          <div id="word-display">_ _ _ _ _</div>
        </div>
        <div class="header-spacer"></div>
        <!-- Restart button - only visible in Electron app for host -->
        <button id="btn-force-restart" class="btn-orange btn-restart hidden" title="Restart Game (keeps scores)">🔄
          Restart</button>
      </div>

      <!-- Game Content -->
      <div class="game-content">
        <!-- Left: Players -->
        <div class="panel game-players">
          <div id="game-player-list" class="player-list">
            <!-- Game player items -->
          </div>
        </div>

        <!-- Center: Canvas -->
        <div class="panel game-canvas-container">
          <canvas id="drawing-canvas"></canvas>
          <div id="canvas-overlay" class="hidden">
            <div id="overlay-message">Waiting for round to start...</div>
            <div id="word-selection" class="hidden">
              <div class="word-choices">
                <!-- Word buttons will be inserted here -->
              </div>
            </div>
          </div>

          <!-- Toolbar -->
          <div class="toolbar">
            <div class="colors" id="color-palette">
              <!-- Color swatches will be inserted by JS -->
            </div>

            <div class="tools-group">
              <button id="tool-pencil" class="tool-btn active" title="Pencil">✏️</button>
              <button id="tool-eraser" class="tool-btn" title="Eraser">🧼</button>
              <button id="tool-fill" class="tool-btn" title="Fill">🪣</button>
              <button id="tool-clear" class="tool-btn" title="Clear All">🗑️</button>
            </div>

            <div class="brush-sizes">
              <div class="brush-size small active" data-size="4"></div>
              <div class="brush-size medium" data-size="10"></div>
              <div class="brush-size large" data-size="20"></div>
              <div class="brush-size xlarge" data-size="35"></div>
            </div>
          </div>
        </div>

        <!-- Right: Chat -->
        <div class="panel game-chat">
          <div class="panel-header">Chat</div>
          <div id="game-chat-messages" class="chat-messages"></div>
          <div class="chat-input-area">
            <input type="text" id="game-chat-input" placeholder="Type your guess here...">
          </div>
        </div>
      </div>

    </div>
  </div>


  <!-- SCREEN: GAME OVER -->
  <div id="screen-gameover" class="screen hidden">
    <div class="gameover-container">
      <h1 class="gameover-title">🎮 Game Over! 🎮</h1>

      <div class="podium">
        <div class="podium-place second">
          <div class="podium-avatar" id="winner-2-avatar">😀</div>
          <div class="podium-medal">🥈</div>
          <div class="podium-name" id="winner-2-name">-</div>
          <div class="podium-score" id="winner-2-score">0 pts</div>
          <div class="podium-stand second-stand">2</div>
        </div>

        <div class="podium-place first">
          <div class="podium-avatar" id="winner-1-avatar">😀</div>
          <div class="podium-medal">🏅</div>
          <div class="podium-name" id="winner-1-name">-</div>
          <div class="podium-score" id="winner-1-score">0 pts</div>
          <div class="podium-stand first-stand">1</div>
        </div>

        <div class="podium-place third">
          <div class="podium-avatar" id="winner-3-avatar">😀</div>
          <div class="podium-medal">🥉</div>
          <div class="podium-name" id="winner-3-name">-</div>
          <div class="podium-score" id="winner-3-score">0 pts</div>
          <div class="podium-stand third-stand">3</div>
        </div>
      </div>

      <button id="btn-play-again" class="btn-green btn-large">Play Again</button>
    </div>
  </div>
</body>

</html>
